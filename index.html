<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SCREEN 1: fake lock screen -->
<section id="screen-lock" class="screen active">
  <div class="lock-top">
    <div class="clock" id="clock">9:41</div>
    <div class="date" id="date">Friday, July 11</div>
  </div>

  <div class="lock-mid">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M12 17a2 2 0 002-2 2 2 0 00-2-2 2 2 0 00-2 2 2 2 0 002 2m6-9a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V10a2 2 0 012-2h1V6a5 5 0 0110 0v2h1M12 3a3 3 0 00-3 3v2h6V6a3 3 0 00-3-3z"/></svg>
    </div>
    <div class="prompt">Enter Passcode</div>
    <div class="dots" id="dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </div>

  <div class="keypad" id="keypad">
    <button class="key" data-key="1"><span class="num">1</span></button>
    <button class="key" data-key="2"><span class="num">2</span><span class="letters">ABC</span></button>
    <button class="key" data-key="3"><span class="num">3</span><span class="letters">DEF</span></button>
    <button class="key" data-key="4"><span class="num">4</span><span class="letters">GHI</span></button>
    <button class="key" data-key="5"><span class="num">5</span><span class="letters">JKL</span></button>
    <button class="key" data-key="6"><span class="num">6</span><span class="letters">MNO</span></button>
    <button class="key" data-key="7"><span class="num">7</span><span class="letters">PQRS</span></button>
    <button class="key" data-key="8"><span class="num">8</span><span class="letters">TUV</span></button>
    <button class="key" data-key="9"><span class="num">9</span><span class="letters">WXYZ</span></button>
    <button class="key key-ghost"></button>
    <button class="key" data-key="0"><span class="num">0</span></button>
    <button class="key key-del" id="del-key" aria-label="delete">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
    </button>
  </div>
</section>

<!-- SCREEN 2: home dashboard -->
<section id="screen-home" class="screen">
  <header class="home-header">
    <div class="brand">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3.5 12h3l2-6 3 12 2-9 1.5 3H21" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">VitalScan</span>
    </div>
    <div class="avatar">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/></svg>
    </div>
  </header>

  <div class="home-greeting">
    <div class="greeting-text" id="greeting-text">Welcome back</div>
    <div class="greeting-date" id="greeting-date">Saturday, July 11</div>
  </div>

  <button class="scan-card" id="start-scan-card">
    <span class="scan-card-icon">
      <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.52 9.86 2 12.01 2c2.13 0 3.99.47 5.7 1.44.24.13.32.44.2.68-.13.24-.44.32-.68.35zM3.5 9.72c-.1 0-.2-.03-.29-.08-.23-.13-.32-.42-.19-.66.4-.72 1.13-1.85 2.44-2.9C5.75 5.9 6.05 6.16 6.05 6.5c0 .21-.11.4-.27.51-1.17.94-1.83 1.94-2.19 2.6-.09.16-.26.11-.09.11zm3.29 12.28c-.13 0-.26-.05-.36-.15-.06-.06-1.5-1.51-2.34-3.13-.87-1.66-1.32-3.65-1.32-5.72 0-1.24.31-2.44.8-3.5.14-.25.44-.34.68-.2.25.13.34.44.2.68-.43.94-.68 1.98-.68 3.02 0 1.9.41 3.71 1.19 5.22.79 1.51 2.13 2.86 2.19 2.92.2.2.2.51 0 .71-.1.1-.23.15-.36.15zM12.4 21.9c-1.31 0-2.6-.4-3.62-1.12-1.31-.94-2.19-2.28-2.5-3.79-.06-.27.12-.53.39-.59.27-.06.53.12.59.39.26 1.28 1.01 2.42 2.12 3.21.87.62 1.94.95 3.02.95.24 0 .47-.02.7-.05.27-.03.52.16.55.44.03.28-.16.53-.44.55-.28.03-.55.05-.81.05zM16.44 20.83c-.2 0-.39-.12-.47-.32-.09-.24.02-.51.26-.61 1.83-.79 2.98-2.5 2.98-4.4v-3.24c0-.39-.04-.79-.13-1.19-.06-.27.11-.53.38-.6.27-.06.53.11.6.38.1.46.15.94.15 1.41v3.24c0 2.32-1.38 4.37-3.6 5.34-.06.03-.12.04-.19.04zM9.14 20.16c-.09 0-.19-.03-.27-.08-1.62-1.03-2.58-2.79-2.58-4.72v-3.24c0-3.16 2.58-5.74 5.74-5.74s5.74 2.58 5.74 5.74c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-2.61-2.13-4.74-4.74-4.74s-4.74 2.13-4.74 4.74v3.24c0 1.58.79 3.03 2.13 3.89.24.15.31.46.16.7-.1.14-.26.21-.44.21zM19.65 15.28c-.28 0-.5-.22-.5-.5v-3.24c0-3.94-3.2-7.14-7.14-7.14-1.2 0-2.39.31-3.42.89-.24.14-.55.05-.68-.19-.14-.24-.05-.55.19-.68A8.116 8.116 0 0112.01 3.4c4.49 0 8.14 3.65 8.14 8.14v3.24c0 .28-.22.5-.5.5z"/></svg>
    </span>
    <span class="scan-card-text">
      <span class="scan-card-title">New Diagnostic Scan</span>
      <span class="scan-card-sub">Verify identity &amp; scan sample</span>
    </span>
    <span class="scan-card-arrow">&rsaquo;</span>
  </button>

  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-label"><span class="stat-dot"></span>Device</div>
      <div class="stat-value">Online</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Calibration</div>
      <div class="stat-value">Today</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Battery</div>
      <div class="stat-value">98%</div>
    </div>
  </div>
</section>

<!-- SCREEN 3: thumbprint scan -->
<section id="screen-thumb" class="screen">
  <button class="home-btn" data-nav-home aria-label="back to home">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8z"/></svg>
  </button>
  <div class="thumb-wrap">
    <div class="thumb-title">Identity Verification</div>
    <div class="thumb-sub" id="thumb-sub">Touch and hold sensor</div>

    <button class="thumb-btn" id="thumb-btn" aria-label="scan thumbprint">
      <svg class="ring" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="54"></circle>
        <circle class="ring-progress" id="ring-progress" cx="60" cy="60" r="54"></circle>
      </svg>
      <svg class="finger-icon" viewBox="0 0 24 24" width="56" height="56">
        <path fill="currentColor" d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.52 9.86 2 12.01 2c2.13 0 3.99.47 5.7 1.44.24.13.32.44.2.68-.13.24-.44.32-.68.35zM3.5 9.72c-.1 0-.2-.03-.29-.08-.23-.13-.32-.42-.19-.66.4-.72 1.13-1.85 2.44-2.9C5.75 5.9 6.05 6.16 6.05 6.5c0 .21-.11.4-.27.51-1.17.94-1.83 1.94-2.19 2.6-.09.16-.26.11-.09.11zm3.29 12.28c-.13 0-.26-.05-.36-.15-.06-.06-1.5-1.51-2.34-3.13-.87-1.66-1.32-3.65-1.32-5.72 0-1.24.31-2.44.8-3.5.14-.25.44-.34.68-.2.25.13.34.44.2.68-.43.94-.68 1.98-.68 3.02 0 1.9.41 3.71 1.19 5.22.79 1.51 2.13 2.86 2.19 2.92.2.2.2.51 0 .71-.1.1-.23.15-.36.15zM12.4 21.9c-1.31 0-2.6-.4-3.62-1.12-1.31-.94-2.19-2.28-2.5-3.79-.06-.27.12-.53.39-.59.27-.06.53.12.59.39.26 1.28 1.01 2.42 2.12 3.21.87.62 1.94.95 3.02.95.24 0 .47-.02.7-.05.27-.03.52.16.55.44.03.28-.16.53-.44.55-.28.03-.55.05-.81.05zM16.44 20.83c-.2 0-.39-.12-.47-.32-.09-.24.02-.51.26-.61 1.83-.79 2.98-2.5 2.98-4.4v-3.24c0-.39-.04-.79-.13-1.19-.06-.27.11-.53.38-.6.27-.06.53.11.6.38.1.46.15.94.15 1.41v3.24c0 2.32-1.38 4.37-3.6 5.34-.06.03-.12.04-.19.04zM9.14 20.16c-.09 0-.19-.03-.27-.08-1.62-1.03-2.58-2.79-2.58-4.72v-3.24c0-3.16 2.58-5.74 5.74-5.74s5.74 2.58 5.74 5.74c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-2.61-2.13-4.74-4.74-4.74s-4.74 2.13-4.74 4.74v3.24c0 1.58.79 3.03 2.13 3.89.24.15.31.46.16.7-.1.14-.26.21-.44.21zM19.65 15.28c-.28 0-.5-.22-.5-.5v-3.24c0-3.94-3.2-7.14-7.14-7.14-1.2 0-2.39.31-3.42.89-.24.14-.55.05-.68-.19-.14-.24-.05-.55.19-.68A8.116 8.116 0 0112.01 3.4c4.49 0 8.14 3.65 8.14 8.14v3.24c0 .28-.22.5-.5.5z"/>
      </svg>
      <div class="scan-sweep" id="scan-sweep"></div>
    </button>

    <div class="thumb-success" id="thumb-success">
      <div class="check">✓</div>
      <div class="success-text">Successfully Scanned</div>
      <button class="proceed-btn" id="proceed-btn">Proceed</button>
    </div>
  </div>
</section>

<!-- SCREEN 4: detection display -->
<section id="screen-detect" class="screen">
  <button class="home-btn" data-nav-home aria-label="back to home">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8z"/></svg>
  </button>
  <div class="detect-title">Scanner</div>

  <div class="scan-pad" id="scan-pad">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <div class="pad-sweep" id="pad-sweep"></div>
    <div class="pad-status" id="pad-status">Place object above sensor</div>
    <div class="result-number" id="result-number"></div>
  </div>

  <button class="scan-action" id="scan-action">Scan</button>
</section>

<script src="script.js"></script>
</body>
</html>
